<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
            rel="shortcut icon"
            href="https://www.svgrepo.com/show/482520/clothes-hanger.svg"
            type="image/x-svg">
    <title>week11-task2-Cart</title>
    <link rel="stylesheet" href="./assets/styles/style.css">
</head>
<body class="body">

    <header class="header">
        <div class="header_flex-item-left">
            <button type="button" class="btn-arrow">
                <img src="./assets/images/vector_arrow-left.svg" alt="back to the previous page" class="arrow-left">
            </button>
        </div>
        <div class="header_flex-item-right">
            <h1 class="title">
                <a href="#">Your cart</a>
            </h1>
    </header>

    <main class="main">

        <section class="main_flex-item1_product-card1">
            <div class="product-card1_img1">
                <img src="./assets/images/img_sweater-green.jpg" alt="" class="img_sweater-green">
            </div>
            <div class="product-card1_inf">
                <div class="inf_flex-item1">
                    <div class="inf_description">
                        <p class="inf_description-text">
                            Green "Chicago" Sweater
                        </p>
                    </div>
                    <div class="inf_cost">
                        <span class="price1">
                            28.99
                        </span>
                    </div>
                </div>
                <div class="inf_flex-item2">
                    <p class="inf_size-colour">
                        S | Green
                    </p>
                </div>
                <div class="inf_flex-item3">
                    <div class="inf_quantity-container">
                        <span class="inf_quantity-delete">
                            <button class="inf_quantity-delete-btn" id="minus1">
                                <img src="./assets/images/vector_minus.svg" alt="delete product" class="minus">
                            </button>
                        </span>
                        <span class="inf_quantity">
                            <p id="quantity1">
                                1
                            </p>
                        </span>
                        <span class="inf_quantity-add">
                            <button class="inf_quantity-add-btn" id="plus1">
                                <img src="./assets/images/vector_plus.svg" alt="add more" class="plus">
                            </button>
                        </span>
                    </div>
                </div>
            </div>
        </section>

        <section class="main_flex-item2_product-card2">
            <div class="product-card2_img2">
                <img src="./assets/images/img_jeans.jpg" alt="" class="img_jeans">
            </div>
            <div class="product-card1_inf">
                <div class="inf_flex-item1">
                    <div class="inf_description">
                        <p class="inf_description-text">
                            Grey Jeans
                        </p>
                    </div>
                    <div class="inf_cost">
                        <span class="price2">
                            30.99
                        </span>
                    </div>
                </div>
                <div class="inf_flex-item2">
                    <p class="inf_size-colour">
                        10 | Grey
                    </p>
                </div>
                <div class="inf_flex-item3">
                    <div class="inf_quantity-container">
                        <span class="inf_quantity-delete">
                            <button class="inf_quantity-delete-btn" id="minus2">
                                <img src="./assets/images/vector_minus.svg" alt="delete product" class="minus">
                            </button>
                        </span>
                        <span class="inf_quantity">
                            <span id="quantity2">
                                1
                            </span>
                        </span>
                        <span class="inf_quantity-add">
                            <button class="inf_quantity-add-btn" id="plus2">
                                <img src="./assets/images/vector_plus.svg" alt="add more" class="plus">
                            </button>
                        </span>
                    </div>
                </div>
            </div>
        </section>

        <section class="main_flex-item3_product-card3">
            <div class="product-card3_img3">
                <img src="./assets/images/img_trainers.jpg" alt="" class="img_trainers">
            </div>
            <div class="product-card1_inf">
                <div class="inf_flex-item1">
                    <div class="inf_description">
                        <p class="inf_description-text">
                            Trainers
                        </p>
                    </div>
                    <div class="inf_cost">
                        <span class="price3">
                            32.99
                        </span>
                    </div>
                </div>
                <div class="inf_flex-item2">
                    <p class="inf_size-colour">
                        5 | Yellow (tan)
                    </p>
                </div>
                <div class="inf_flex-item3">
                    <div class="inf_quantity-container">
                        <span class="inf_quantity-delete">
                            <button class="inf_quantity-delete-btn" id="minus3">
                                <img src="./assets/images/vector_minus.svg" alt="delete product" class="minus">
                            </button>
                        </span>
                        <span class="inf_quantity">
                            <span id="quantity3">
                                1
                            </span>
                        </span>
                        <span class="inf_quantity-add">
                            <button class="inf_quantity-add-btn" id="plus3">
                                <img src="./assets/images/vector_plus.svg" alt="add more" class="plus">
                            </button>
                        </span>
                    </div>
                </div>
            </div>
        </section>

        <section class="main_flex-item4_product-card4">
            <div class="product-card4_img4">
                <img src="./assets/images/img_sweater-purple.jpg" alt="" class="img_sweater-purple">
            </div>
            <div class="product-card1_inf">
                <div class="inf_flex-item1">
                    <div class="inf_description">
                        <p class="inf_description-text">
                            Purple sweater
                        </p>
                    </div>
                    <div class="inf_cost">
                        <span class="price4">
                            27.99
                        </span>
                    </div>
                </div>
                <div class="inf_flex-item2">
                    <p class="inf_size-colour">
                        M | Purple
                    </p>
                </div>
                <div class="inf_flex-item3">
                    <div class="inf_quantity-container">
                        <span class="inf_quantity-delete">
                            <button class="inf_quantity-delete-btn" id="minus4">
                                <img src="./assets/images/vector_minus.svg" alt="delete product" class="minus">
                            </button>
                        </span>
                        <span class="inf_quantity">
                            <span id="quantity4">
                                1
                            </span>
                        </span>
                        <span class="inf_quantity-add">
                            <button class="inf_quantity-add-btn" id="plus4">
                                <img src="./assets/images/vector_plus.svg" alt="add more" class="plus">
                            </button>
                        </span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer_promotionalcode">
            <input type="text" placeholder="Enter your promotional code" class="promocode">
        </div>
        <div class="footer_totalcost-button">
            <div class="footer_totalcost-button_processorder">
                <button class="discount">
                    <span class="discountText">
                        Use a discount
                    </span>
                </button>
            </div>
            <div class="footer_totalcost-button_totalcost">
                <div class="footer_totalcost-button_totalcost-finalprice">
                    <span class="totalcost_text">
                        Total
                    </span>
                    <span class="totalcost">
                        0
                    </span>
                </div>
                <div class="footer_totalcost-button_totalcost-taxesinf">
                    <p class="taxes">
                        Taxes included
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script src="./assets/scripts/index.js"></script>
</body>
</html>
